[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  VITE_SITE_URL = "https://escape-game-builder.netlify.app"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200

[[redirects]]
  from = "/api/admin/credits"
  to = "/.netlify/functions/ai-credits-admin"
  status = 200

[[redirects]]
  from = "/api/admin/projects"
  to = "/.netlify/functions/admin-projects"
  status = 200

[[redirects]]
  from = "/api/admin/moderation"
  to = "/.netlify/functions/moderation"
  status = 200

[[redirects]]
  from = "/api/ai-credits/admin"
  to = "/.netlify/functions/ai-credits-admin"
  status = 200

[[redirects]]
  from = "/api/ai-credits"
  to = "/.netlify/functions/ai-credits"
  status = 200

[[redirects]]
  from = "/api/storage-upgrade"
  to = "/.netlify/functions/storage-upgrade"
  status = 200

[[redirects]]
  from = "/api/storage-upload"
  to = "/.netlify/functions/storage-upload"
  status = 200

[[redirects]]
  from = "/api/shop/packs"
  to = "/.netlify/functions/shop-packs"
  status = 200

[[redirects]]
  from = "/api/shop/purchase"
  to = "/.netlify/functions/shop-purchase"
  status = 200

[[redirects]]
  from = "/api/projects/publication"
  to = "/.netlify/functions/project-publication"
  status = 200

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200

[[redirects]]
  from = "/api/remove-background"
  to = "/.netlify/functions/remove-background"
  status = 200

[[redirects]]
  from = "/api/ai-job"
  to = "/.netlify/functions/ai-job"
  status = 200

[[redirects]]
  from = "/api/gumroad/webhook"
  to = "/.netlify/functions/gumroad-webhook"
  status = 200

[[redirects]]
  from = "/api/moderation"
  to = "/.netlify/functions/moderation"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
